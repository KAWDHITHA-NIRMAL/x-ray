services:
  xray:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: xray_app
    # hostname: yourhostname <- optional
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - $PWD/db/:/etc/x-ray/
      - $PWD/cert/:/root/cert/
      - $PWD/acme/:/root/.acme.sh/
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XRAY_ENABLE_FAIL2BAN: "true"
    tty: true
    ports:
      - "2053:2053"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: xray_postgres
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: xray
      POSTGRES_PASSWORD: xray
      POSTGRES_DB: xray
    volumes:
      - $PWD/pgdata/:/var/lib/postgresql/data
    restart: unless-stopped
